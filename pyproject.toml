[project]
name = "protosignet"
version = "0.0.1"
description = "Designing network motifs via ODE modeling and NSGA-II."
authors = [{ name = "Phuong Ho", email = "phuongho43@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.9,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "joblib>=1.4.2",
    "matplotlib>=3.9.3",
    "natsort>=8.4.0",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "prettytable>=3.12.0",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
]

[project.urls]
Repository = "https://github.com/phuongho43/protosignet"

[project.scripts]
evolve_motifs = "protosignet.evolve_motifs:main"
analyze_motifs = "protosignet.analyze_motifs:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.20.0",
    "mypy>=0.991",
    "ruff>=0.6.9",

]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["protosignet"]

[tool.mypy]
files = ["protosignet"]
# Annotating this research code was never done and is not a prerequisite for depositing it.
# check_untyped_defs below still type-checks the BODIES of unannotated functions, which is
# where real bugs live; requiring signatures everywhere only produced noise.
disallow_untyped_defs = false
disallow_any_unimported = false
# scipy, pandas, lmfit and matplotlib ship no stubs; that is their choice, not a defect here.
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 200
fix = true

[tool.ruff.lint]
# "x" in a plot axis label is correct typography, not a homoglyph.
allowed-confusables = ["×", "−", "≈", "·"]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Asserts encode invariants in the search scripts (dose-matched regimes); the same
    # reason tests/* is already exempt below.
    "S101",
    # Pushes every exception message into a custom class -- wrong shape for analysis scripts.
    "TRY003",
    # A script's main() is expected to be a long sequence.
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true
